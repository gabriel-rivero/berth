# berth ui: winit event loop, wgpu renderer (glyphs, sidebar, tabs, splits)
[package]
name = "berth-ui"
description = "berth's window/renderer: sidebar, tab bar, pane grids"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
berth-core = { path = "../core" }
directories.workspace = true
berth-emulation = { path = "../emulation" }
alacritty_terminal.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster = "1.0"
image.workspace = true
berth-plugins = { path = "../plugins" }
anyhow.workspace = true
swash = "0.2.10"
fontdb = "0.24.0"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
# WGSL validation of the render shader without a GPU (tests run on CI runners too).
naga = "30"
