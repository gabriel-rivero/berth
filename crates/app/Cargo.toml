# berth app: the binary. Wires core/config, emulation panes, ui window, plugin host.
[package]
name = "berth"
description = "A Ghostty-like cross-platform terminal with a left tab sidebar and workspaces"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-core = { path = "../core" }
berth-ui = { path = "../ui" }
anyhow.workspace = true
