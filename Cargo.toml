# berth — cross-platform terminal emulator with left-side tab sidebar and workspaces.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# x-release-please-start-version
version = "0.29.1"
# x-release-please-end
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gabriel-rivero/berth"
readme = "README.md"

[workspace.dependencies]
# emulation
alacritty_terminal = "0.26"
portable-pty = "0.9"
# ui
winit = "0.30"
wgpu = "30"
# plugins (sandboxed, wasm32-wasip1 guests)
wasmtime = { version = "50", features = ["component-model"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
# plumbing
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
directories = "6"
anyhow = "1"
thiserror = "2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = "debuginfo"
