name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # Guest plugins (wasm32-wasip2 component) build on Linux only.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path crates/plugins/guest/Cargo.toml --release --target wasm32-wasip2
      - run: cargo test --workspace

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate AppStream metadata
        run: sudo apt-get update && sudo apt-get install -y appstream && appstreamcli validate --no-net packaging/io.github.gabriel_rivero.berth.metainfo.xml
      - name: validate desktop entry
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/berth.desktop

  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p berth
      - name: binary size budget
        run: |
          size=$(stat -c %s target/release/berth)
          echo "berth binary: ${size} bytes"
          # 60 MiB ceiling: the 2026-11 measurement is ~49 MB; catch wgpu/plugin
          # stack bloat early without failing on minor dependency growth.
          limit=$((60 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "::error::berth binary exceeds the 60 MiB budget (${size} bytes)"
            exit 1
          fi
      - run: ./target/release/berth --version
