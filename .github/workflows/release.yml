# Builds platform binaries on every v* tag (created by release-please) and attaches
# them to the GitHub Release. Runs on linux (musl), macOS (arm + intel), windows.
name: release
on:
  push:
    tags: ["v*"]
  # needed in practice: release-please tags with GITHUB_TOKEN, and tag pushes
  # made with GITHUB_TOKEN do not trigger other workflows -> dispatch manually
  # on the tag ref after merging the release PR.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, archive: tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: musl prereqs (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: musl prereqs (aarch64 cross toolchain)
        # musl.cc is flaky from GitHub runners (curl timeouts); zig cc is a
        # reliable drop-in cross linker for the musl target via cargo-zigbuild.
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip3 install --quiet ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --target ${{ matrix.target }}
        if: matrix.target != 'aarch64-unknown-linux-musl'
      - run: cargo zigbuild --release --target ${{ matrix.target }}
        if: matrix.target == 'aarch64-unknown-linux-musl'
      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          dir=berth-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/berth "$dir"/
          tar czf berth-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz "$dir"
      - name: attach tar.gz early (best-effort)
        # Upload the archive before the deb/rpm steps run; later packaging
        # failures then can't cost us the base archive (softprops re-uploads).
        if: matrix.archive == 'tar.gz'
        run: gh release upload "$GITHUB_REF_NAME" "berth-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz" --repo gabriel-rivero/berth --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: package deb (linux)
        if: matrix.archive == 'tar.gz' && contains(matrix.target, 'unknown-linux-musl')
        run: |
          ver=${GITHUB_REF_NAME#v}
          case '${{ matrix.target }}' in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
          esac
          root=berth_${ver}_${arch}
          mkdir -p "$root"/DEBIAN "$root"/usr/bin "$root"/usr/share/applications \
            "$root"/usr/share/metainfo \
            "$root"/usr/share/icons/hicolor/64x64/apps \
            "$root"/usr/share/icons/hicolor/128x128/apps \
            "$root"/usr/share/icons/hicolor/256x256/apps
          install -m 755 target/${{ matrix.target }}/release/berth "$root"/usr/bin/berth
          printf '%s\n' \
            'Package: berth' \
            "Version: $ver" \
            'Section: utils' \
            'Priority: optional' \
            "Architecture: $arch" \
            'Maintainer: Gabriel Rivero <gabriel-rivero@users.noreply.github.com>' \
            'Description: terminal emulator with workspaces, tabs and splits' \
            ' berth is a Ghostty-inspired terminal emulator with a workspace' \
            ' sidebar, split panes, a clickable tab bar and hot-reloading TOML' \
            ' config. Static musl build: no dependencies on the host.' \
            > "$root"/DEBIAN/control
          # Single source of truth: packaging/berth.desktop (not an inline copy).
          install -m 644 packaging/berth.desktop "$root"/usr/share/applications/berth.desktop
          install -m 644 packaging/io.github.gabriel_rivero.berth.metainfo.xml \
            "$root"/usr/share/metainfo/
          install -m 644 assets/berth-64.png "$root"/usr/share/icons/hicolor/64x64/apps/berth.png
          install -m 644 assets/berth-128.png "$root"/usr/share/icons/hicolor/128x128/apps/berth.png
          install -m 644 assets/berth-256.png "$root"/usr/share/icons/hicolor/256x256/apps/berth.png
          dpkg-deb --root-owner-group --build "$root"
      - name: package rpm (linux)
        if: matrix.archive == 'tar.gz' && contains(matrix.target, 'unknown-linux-musl')
        run: |
          cargo install --locked cargo-generate-rpm
          ver=${GITHUB_REF_NAME#v}
          case '${{ matrix.target }}' in
            x86_64-*) arch=x86_64 ;;
            aarch64-*) arch=aarch64 ;;
          esac
          # Unknown-arch rpm builds fail on rpmbuild (missing platform macros for
          # aarch64 on Ubuntu); cargo-generate-rpm writes the rpm directly, and
          # --target both rewrites assets to target/<triple>/release/ and sets arch.
          cargo generate-rpm -p crates/app --target ${{ matrix.target }} \
            -o "berth-${ver}-${arch}.rpm"

      - name: package .app bundle (macOS)
        # A raw Unix binary launched from Finder opens a Terminal.app window first
        # (the reported behavior); a Berth.app bundle launches clean without a
        # terminal. Unsigned: users need right-click > Open (or xattr -cr Berth.app)
        # to pass Gatekeeper.
        if: matrix.archive == 'tar.gz' && contains(matrix.target, 'apple-darwin')
        run: |
          app=Berth.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/${{ matrix.target }}/release/berth "$app/MacOS/berth"
          cat > "$app/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>berth</string>
            <key>CFBundleIdentifier</key><string>io.github.gabriel-rivero.berth</string>
            <key>CFBundleIconFile</key><string>berth</string>
            <key>CFBundleName</key><string>Berth</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no identity needed): keeps Gatekeeper from calling
          # the unsigned bundle "damaged"; users still right-click > Open once.
          cp assets/berth.icns "$app/Resources/berth.icns"
          codesign --force --deep --sign - Berth.app
          zip -qr berth-${GITHUB_REF_NAME#v}-${{ matrix.target }}.app.zip Berth.app
      - name: package (windows)
        if: matrix.archive == 'zip'
        run: |
          $dir = "berth-${{ matrix.target }}"
          New-Item -ItemType Directory -ErrorAction SilentlyContinue "$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/berth.exe" "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "berth-${GITHUB_REF_NAME#v}-${{ matrix.target }}.zip"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            berth-*${{ matrix.archive }}
            berth-*.app.zip
            berth_*.deb
            berth-*.rpm
          generate_release_notes: true

  # Runs after every platform job so the checksum file covers all assets
  # (deb/rpm/app.zip included), not just the ones this runner built.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          mkdir dist
          gh release download "$GITHUB_REF_NAME" --repo gabriel-rivero/berth --dir dist --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write sha256sums.txt
        run: |
          cd dist
          sha256sum * > ../sha256sums.txt
          cat ../sha256sums.txt
      - name: Attach checksums
        run: gh release upload "$GITHUB_REF_NAME" sha256sums.txt --repo gabriel-rivero/berth --clobber
        env:
          GH_TOKEN: ${{ github.token }}
