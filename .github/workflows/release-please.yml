# Maintains CHANGELOG.md + bumps [workspace.package] version on merges to main
# (driven by Conventional Commits: feat:, fix:, chore:, etc.), then tags v0.1.x
# which kicks off .github/workflows/release.yml.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
